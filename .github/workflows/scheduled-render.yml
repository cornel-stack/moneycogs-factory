name: Scheduled render

# MoneyCogs daily factory. Renders everything DUE — scheduled calendar entries
# with publish_date ≤ today (self-heals a failed day) — into ONE bundle Release
# `content-<date>`. On success each entry flips to "rendered" (bot commit,
# [skip ci]); failures open an issue. Calendar sanity: entries whose script file
# is missing are SKIPPED (with a logged warning + an issue), never fatal.
#
# PHASE 3: the cron is ENABLED — weekdays 03:47 UTC (06:47 EAT). A manual
# workflow_dispatch still works (dry_run defaults to true). Secrets posture:
# AZURE_SPEECH_KEY/REGION are OPTIONAL (passed via secrets: inherit to the TTS
# fallback); with none set, CI uses free edge-tts, then offline Kokoro.
on:
  schedule:
    - cron: "47 3 * * 1-5" # weekdays 03:47 UTC = 06:47 EAT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only — don't render or commit"
        type: boolean
        default: true
      today_override:
        description: "Override 'today' (YYYY-MM-DD, Nairobi). Blank = real date."
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      longform_ids: ${{ steps.p.outputs.longform_ids }}
      short_ids_csv: ${{ steps.p.outputs.short_ids_csv }}
      all_ids: ${{ steps.p.outputs.all_ids }}
      tag: ${{ steps.p.outputs.tag }}
      has_long: ${{ steps.p.outputs.has_long }}
      has_short: ${{ steps.p.outputs.has_short }}
      has_any: ${{ steps.p.outputs.has_any }}
      dry: ${{ steps.p.outputs.dry }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OV="${{ inputs.today_override }}"
          if [ -n "$OV" ]; then TODAY="$OV"; else TODAY=$(TZ=Africa/Nairobi date +%F); fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "false" ]; then DRY=true; else DRY=false; fi
          # DUE = scheduled entries with publish_date <= today (no lookahead).
          # CALENDAR SANITY: entries whose script file is missing are SKIPPED, not
          # fatal — the upstream factory died on exactly this. Skipped ids are
          # logged + reported to an issue below.
          eval "$(TODAY="$TODAY" node -e '
            const fs = require("fs");
            const cal = require("./content/calendar.json");
            const today = process.env.TODAY;
            const sched = cal.filter(e => e.status === "scheduled" && e.publish_date <= today);
            const hasScript = id => fs.existsSync("content/videos/" + id + ".json");
            const missing = [...new Set(sched.filter(e => !hasScript(e.video_id)).map(e => e.video_id))];
            const due = sched.filter(e => hasScript(e.video_id));
            const lf = due.filter(e => (e.format||"longform") === "longform").map(e => e.video_id);
            const sh = due.filter(e => e.format === "short").map(e => e.video_id);
            const all = due.map(e => e.video_id);
            const out = {
              longform_ids: JSON.stringify(lf),
              short_ids_csv: sh.join(","),
              all_ids: JSON.stringify(all),
              missing_ids: JSON.stringify(missing),
              tag: "content-" + today,
              has_long: lf.length ? "true" : "false",
              has_short: sh.length ? "true" : "false",
              has_any: all.length ? "true" : "false",
            };
            for (const [k,v] of Object.entries(out)) console.log(`${k}=${JSON.stringify(v)}`);
          ')"
          {
            echo "longform_ids=$longform_ids"
            echo "short_ids_csv=$short_ids_csv"
            echo "all_ids=$all_ids"
            echo "tag=$tag"
            echo "has_long=$has_long"
            echo "has_short=$has_short"
            echo "has_any=$has_any"
            echo "dry=$DRY"
          } >> "$GITHUB_OUTPUT"
          echo "### Scheduled render — plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- today (Nairobi): **$TODAY** → bundle **$tag**, dry: **$DRY**" >> "$GITHUB_STEP_SUMMARY"
          echo "- long-form: \`$longform_ids\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- shorts: \`$short_ids_csv\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Plan: tag=$tag long=$longform_ids shorts=$short_ids_csv dry=$DRY"
          # CALENDAR SANITY — skip (don't fail) entries with no script; report them.
          if [ "$missing_ids" != "[]" ]; then
            echo "::warning title=Calendar sanity::Skipping scheduled ids with no script file: $missing_ids"
            echo "- ⚠ SKIPPED (no script file): \`$missing_ids\`" >> "$GITHUB_STEP_SUMMARY"
            if [ "$DRY" != "true" ]; then
              TITLE="Calendar sanity: scheduled ids missing a script"
              RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              NUM=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number' || echo "")
              BODY="These calendar entries for **$tag** are 'scheduled' but have no content/videos/<id>.json, so they were SKIPPED (not rendered): $missing_ids. Either write the script or remove/re-date the calendar entry. Run: $RUN"
              if [ -n "$NUM" ]; then gh issue comment "$NUM" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY" --label "automation" 2>/dev/null || gh issue create --title "$TITLE" --body "$BODY"; fi
            fi
          fi

  prep-release:
    needs: plan
    if: needs.plan.outputs.has_any == 'true' && needs.plan.outputs.dry == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pre-create the bundle Release (avoids concurrent create races)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.plan.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Daily content bundle: ${TAG#content-}."

  render-long:
    needs: [plan, prep-release]
    if: needs.plan.outputs.has_long == 'true' && needs.plan.outputs.dry == 'false'
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.longform_ids) }}
    uses: ./.github/workflows/render.yml
    with:
      video_id: ${{ matrix.id }}
      release_tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit # pass AZURE_SPEECH_KEY/REGION to the TTS fallback

  render-shorts:
    needs: [plan, prep-release]
    if: needs.plan.outputs.has_short == 'true' && needs.plan.outputs.dry == 'false'
    uses: ./.github/workflows/render-shorts.yml
    with:
      ids: ${{ needs.plan.outputs.short_ids_csv }}
      release_tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit # pass AZURE_SPEECH_KEY/REGION to the TTS fallback

  finalize:
    needs: [plan, render-long, render-shorts]
    if: always() && needs.plan.outputs.dry == 'false' && needs.plan.outputs.has_any == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flip rendered + bot commit; issue on failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LONG_OK='${{ needs.render-long.result == 'success' || needs.render-long.result == 'skipped' }}'
          SHORT_OK='${{ needs.render-shorts.result == 'success' || needs.render-shorts.result == 'skipped' }}'
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          node -e '
            const fs=require("fs"); const path="content/calendar.json";
            const cal=JSON.parse(fs.readFileSync(path,"utf8"));
            const longOk=process.env.LONG_OK==="true", shortOk=process.env.SHORT_OK==="true";
            const due=JSON.parse(process.env.ALL_IDS);
            for(const e of cal){
              if(!due.includes(e.video_id)||e.status!=="scheduled")continue;
              const ok=(e.format==="short")?shortOk:longOk;
              if(ok)e.status="rendered";
            }
            fs.writeFileSync(path,JSON.stringify(cal,null,2)+"\n");
          ' ALL_IDS='${{ needs.plan.outputs.all_ids }}' LONG_OK="$LONG_OK" SHORT_OK="$SHORT_OK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/calendar.json
          git commit -m "calendar: ${{ needs.plan.outputs.tag }} rendered [skip ci]" || echo "nothing to commit"
          git push || echo "nothing to push"
          if [ "$LONG_OK" != "true" ] || [ "$SHORT_OK" != "true" ]; then
            FAILED=""
            [ "$LONG_OK" != "true" ] && FAILED="$FAILED\n- **longform render** step failed → ids: \`${{ needs.plan.outputs.longform_ids }}\`"
            [ "$SHORT_OK" != "true" ] && FAILED="$FAILED\n- **shorts render** step failed → ids: \`${{ needs.plan.outputs.short_ids_csv }}\`"
            TITLE="Render failed: ${{ needs.plan.outputs.tag }}"
            NUM=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number' || echo "")
            BODY=$(printf "A scheduled render failed for **${{ needs.plan.outputs.tag }}**.\nWhat failed:%b\n\nRun: %s\nFailed entries stay 'scheduled' and retry next weekday." "$FAILED" "$RUN")
            if [ -n "$NUM" ]; then gh issue comment "$NUM" --body "$BODY"; else gh issue create --title "$TITLE" --body "$BODY"; fi
          fi
